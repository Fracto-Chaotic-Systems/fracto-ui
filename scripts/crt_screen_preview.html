<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRT screen content preview</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        background: #e7eaec;
        font-family: system-ui, sans-serif;
      }
      label {
        display: block;
        margin-bottom: 0.75rem;
      }
      select {
        font: inherit;
        margin-left: 0.5rem;
      }
      #preview {
        width: min(100%, 500px);
        aspect-ratio: 1.25;
      }
      #preview > div {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useEffect, useMemo, useState } from "react";
      import { createRoot } from "react-dom/client";
      import GamesCrt from "/src/pages/games/GamesCrt.jsx";
      import AppText from "/src/AppText.jsx";
      import { APP_GAMES_TEXT } from "/src/text/GamesText.jsx";
      import screen_media from "virtual:crt-screen-media";
      AppText.initialize(APP_GAMES_TEXT);
      const h = React.createElement;
      function Preview() {
        const [mode, set_mode] = useState("face");
        const sources = useMemo(() => {
          const image = document.createElement("canvas");
          image.width = 640;
          image.height = 360;
          const ctx = image.getContext("2d");
          ctx.fillStyle = "#272b65";
          ctx.fillRect(0, 0, 640, 360);
          ctx.fillStyle = "#e2ad54";
          ctx.fillRect(0, 240, 640, 120);
          ctx.fillStyle = "#92d9d6";
          ctx.beginPath();
          ctx.arc(475, 104, 64, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "white";
          ctx.font = "bold 52px system-ui";
          ctx.fillText("IMAGE", 40, 110);
          const video_canvas = document.createElement("canvas");
          video_canvas.width = 640;
          video_canvas.height = 360;
          const video = document.createElement("video");
          video.muted = true;
          video.playsInline = true;
          const stream = video_canvas.captureStream?.(12);
          if (stream) video.srcObject = stream;
          return { image: image.toDataURL(), video_canvas, video, stream };
        }, []);
        useEffect(
          () => () => {
            sources.video.pause();
            sources.stream?.getTracks().forEach((track) => track.stop());
          },
          [sources],
        );
        useEffect(() => {
          if (mode !== "video" && mode !== "mixed") return;
          let frame,
            previous = 0;
          const ctx = sources.video_canvas.getContext("2d");
          const draw = (time) => {
            if (time - previous > 80) {
              ctx.fillStyle = "#123e59";
              ctx.fillRect(0, 0, 640, 360);
              ctx.fillStyle = "#e27a55";
              ctx.fillRect(((time * 0.1) % 800) - 160, 90, 160, 180);
              ctx.fillStyle = "white";
              ctx.font = "bold 48px system-ui";
              ctx.fillText("VIDEO", 35, 65);
              previous = time;
            }
            frame = requestAnimationFrame(draw);
          };
          frame = requestAnimationFrame(draw);
          sources.video.play().catch(() => {});
          return () => {
            cancelAnimationFrame(frame);
            sources.video.pause();
          };
        }, [mode, sources]);
        const content = useMemo(() => {
          const draw = (ctx, { time, width, height }) => {
            ctx.fillStyle = "#60efca";
            ctx.beginPath();
            ctx.arc(
              width * (0.5 + Math.sin(time * 1.3) * 0.3),
              height * 0.55,
              40,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          };
          if (mode === "face") return undefined;
          if (mode === "portrait")
            return {
              layers: [
                { type: "image", source: "/screens/58.jpg", pan_duration: 6 },
              ],
            };
          if (mode === "playlist") return { playlist: screen_media };
          if (mode === "library-video")
            return {
              layers: screen_media
                .filter((item) => item.type === "video")
                .slice(0, 1),
            };
          if (mode === "static") return { layers: [{ type: "static" }] };
          if (mode === "image")
            return { layers: [{ type: "image", source: sources.image }] };
          if (mode === "video")
            return { layers: [{ type: "video", source: sources.video }] };
          if (mode === "animation")
            return { layers: [{ type: "animation", draw }] };
          return {
            layers: [
              { type: "video", source: sources.video },
              { type: "animation", draw, opacity: 0.8 },
              { type: "static", opacity: 0.16, blend: "screen" },
            ],
          };
        }, [mode, sources]);
        return h(
          React.Fragment,
          null,
          h(
            "label",
            null,
            "Screen content",
            h(
              "select",
              {
                "aria-label": "Screen content",
                value: mode,
                onChange: (event) => set_mode(event.target.value),
              },
              ...[
                "face",
                "static",
                "image",
                "video",
                "animation",
                "mixed",
                "playlist",
                "library-video",
                "portrait",
              ].map((value) => h("option", { key: value, value }, value)),
            ),
          ),
          h("div", { id: "preview" }, h(GamesCrt, { screen_content: content })),
          h(
            "p",
            null,
            "Move the pointer to turn the TV. Click its screen to extend or retract.",
          ),
        );
      }
      createRoot(document.getElementById("root")).render(h(Preview));
    </script>
  </body>
</html>
